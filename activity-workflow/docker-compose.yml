services:
  postgres:
    image: postgres:16-alpine
    container_name: aw-postgres
    environment:
      POSTGRES_DB: activity_workflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activity_workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: aw-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/activity_workflow
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  aw_pgdata:
