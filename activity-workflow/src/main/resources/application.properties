# ============================================================
#  Activity Workflow - base configuration
#  Profile-specific overrides in application-{dev,prod}.properties
# ============================================================

spring.application.name=activity-workflow
spring.profiles.active=dev

# ============================================================
#  PostgreSQL datasource
# ============================================================
spring.datasource.url=jdbc:postgresql://10.1.131.199:5432/pmis_db
spring.datasource.username=pmis_user
spring.datasource.password=aadhaarpmis2026
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=ActivityWorkflowHikariCP

# ============================================================
#  JPA / Hibernate
#  ddl-auto=update - Hibernate creates/updates tables from @Entity
#  classes on startup (no Flyway).
#  Change to "validate" once schema is stable.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
#  Server
# ============================================================
server.port=8080
server.servlet.context-path=/activity-workflow

# ============================================================
#  OpenAPI / Swagger
#  UI:   http://localhost:8080/activity-workflow/swagger-ui.html
#  JSON: http://localhost:8080/activity-workflow/v3/api-docs
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ============================================================
#  Logging
# ============================================================
logging.level.root=INFO
logging.level.com.example.activityworkflow=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
#  Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
