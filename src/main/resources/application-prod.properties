# ============================================================
#  Prod profile - env-driven datasource
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/activity_workflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=25

# In prod, assume tables already exist - just validate the mapping.
# Change to "update" if you want Hibernate to apply schema changes automatically.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.example.activityworkflow=INFO
logging.level.org.hibernate.SQL=WARN
