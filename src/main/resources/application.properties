# ============================================================
#  Activity Workflow - base configuration
#  Profile-specific overrides in application-{dev,prod}.properties
# ============================================================

spring.application.name=activity-workflow
spring.profiles.active=dev

# ============================================================
#  PostgreSQL datasource
# ============================================================
spring.datasource.url=jdbc:postgresql://10.1.131.199:5432/pmis_db
spring.datasource.username=pmis_user
spring.datasource.password=aadhaarpmis2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=workflow

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=ActivityWorkflowHikariCP

# ============================================================
#  JPA / Hibernate
#  ddl-auto=update - Hibernate creates/updates tables from @Entity
#  classes on startup (no Flyway).
#  Change to "validate" once schema is stable.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
#  Server
# ============================================================
server.port=8080
server.servlet.context-path=/activity-workflow

# ============================================================
#  OpenAPI / Swagger
#  UI:   http://localhost:8080/activity-workflow/swagger-ui.html
#  JSON: http://localhost:8080/activity-workflow/v3/api-docs
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ============================================================
#  Upstream activity-assignments API
#  Returns division approvers + users by activityId. The caller's
#  Authorization header is forwarded as-is, no service-account token here.
# ============================================================
app.assignments.enabled=true
app.assignments.url-template=${APP_ASSIGNMENTS_URL:http://10.1.131.199/projects/api/v3/activities/{activityId}/assignments}
app.assignments.connect-timeout-ms=5000
app.assignments.read-timeout-ms=10000

# ============================================================
#  Upstream user-lookup API (called when resolving the SUBMIT
#  actor's email for rejection notifications).
# ============================================================
app.user-details.enabled=true
app.user-details.url-template=${APP_USER_DETAILS_URL:http://10.1.131.199/users/api/v3/users/{userId}}
app.user-details.connect-timeout-ms=5000
app.user-details.read-timeout-ms=10000

# ============================================================
#  Upstream activity-comments API (called by DocumentController on upload)
#  We POST multipart (body + file) directly to /activities/{activityId}/comments.
# ============================================================
app.milestone-comments.enabled=true
app.milestone-comments.comments-url-template=${APP_ACTIVITY_COMMENTS_URL:http://10.1.131.199/projects/api/v3/activities/{activityId}/comments}
app.milestone-comments.comments-list-url-template=${APP_ACTIVITY_COMMENTS_LIST_URL:http://10.1.131.199/projects/api/v3/activities/{activityId}/comments}
app.milestone-comments.activity-lookup-url-template=${APP_ACTIVITY_LOOKUP_URL:http://10.1.131.199/projects/api/v3/activities/{activityId}}
app.milestone-comments.body-field=body
app.milestone-comments.files-field=files
app.milestone-comments.max-file-size-bytes=26214400
app.milestone-comments.connect-timeout-ms=5000
app.milestone-comments.read-timeout-ms=30000

# ---- Spring's multipart upload limits (server-side enforced) ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ============================================================
#  External notification API (called when seeding parallel approvers)
#  Override via env vars in prod:
#    APP_NOTIFICATION_URL, APP_NOTIFICATION_AUTH_TOKEN
# ============================================================
app.notification.enabled=true
app.notification.url=${APP_NOTIFICATION_URL:http://10.1.131.199:8012/notification/email/send}
app.notification.auth-token=${APP_NOTIFICATION_AUTH_TOKEN:}
app.notification.connect-timeout-ms=3000
app.notification.read-timeout-ms=5000

# ============================================================
#  Jackson - tolerate Digit metadata fields like tenantId, RequestInfo we don't model
# ============================================================
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non-null

# ============================================================
#  Logging - INFO everywhere, no SQL/binding traces
# ============================================================
logging.level.root=INFO
logging.level.com.pmis.activityworkflow=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.com.zaxxer.hikari=WARN

# ============================================================
#  Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
